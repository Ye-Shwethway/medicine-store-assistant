name: One-shot Web hardening follow-up

on:
  push:
    branches: [hardening/web-production-reliability]
    paths:
      - 'docs/checkpoints/web-hardening-followup-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/web-production-reliability
          fetch-depth: 0
          persist-credentials: true
      - name: Apply follow-up
        run: |
          set -euo pipefail
          python scripts/patch_web_hardening_followup.py
          node --check backend/app/dashboard_assets/dashboard_multi_agent_review.js
          git diff --check
          git config user.name 'MSA Web Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/dashboard_assets/dashboard_multi_agent_review.js tests/web/multi_agent_feedback_smoke.mjs
          git commit -m 'Give Review cards stable accessible names for browser tests'
          git push origin HEAD:hardening/web-production-reliability
