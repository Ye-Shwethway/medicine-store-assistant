name: One-shot Web hardening patcher

on:
  push:
    branches: [hardening/web-production-reliability]
    paths:
      - 'docs/checkpoints/web-hardening-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: hardening/web-production-reliability
          fetch-depth: 0
          persist-credentials: true
      - name: Apply Web hardening patch
        run: |
          set -euo pipefail
          python scripts/patch_web_hardening.py
          python -m compileall -q backend/app
          node --check backend/app/dashboard_assets/dashboard_multi_agent_review.js
          node --check backend/app/dashboard_assets/dashboard_multi_agent_live_export.js
          git diff --check
          git config user.name 'MSA Web Hardening'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/main.py backend/app/dashboard_assets/dashboard_multi_agent_review.js backend/app/dashboard_assets/dashboard_multi_agent_live_export.js
          git commit -m 'Harden Dashboard asset identity and Review renderer ownership'
          git push origin HEAD:hardening/web-production-reliability
