name: Diagnose D4.8 Review runtime

on:
  push:
    branches: [main]
    paths:
      - 'backend/app/multi_agent_review_runtime_verify.py'
      - '.github/workflows/diagnose-d4-8-review.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose-review-runtime:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run exact Review persistence path with deterministic agent stub
        id: diagnose
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          ENV_FILE=/opt/medicine-store-assistant/secrets/runtime.env
          export COMPOSE_PROJECT_NAME=deploy
          LOG_FILE="${RUNNER_TEMP}/d4-8-review-diagnostic.log"
          docker compose --env-file "$ENV_FILE" -f deploy/docker-compose.yml build api >"$LOG_FILE" 2>&1
          BUILD_STATUS=$?
          STATUS=$BUILD_STATUS
          if [[ $BUILD_STATUS -eq 0 ]]; then
            docker compose --env-file "$ENV_FILE" -f deploy/docker-compose.yml run --rm api python -m app.multi_agent_review_runtime_verify >>"$LOG_FILE" 2>&1
            STATUS=$?
          fi
          TAIL="$(tail -n 80 "$LOG_FILE")"
          export STATUS TAIL
          BODY_FILE="${RUNNER_TEMP}/diagnostic-issue.json"
          python3 - <<'PY' > "$BODY_FILE"
          import json, os
          status = int(os.environ['STATUS'])
          body = "\n".join([
              "Temporary machine-readable D4.8 Review runtime diagnostic.",
              "",
              f"status={'pass' if status == 0 else 'fail'}",
              f"source_sha={os.environ['GITHUB_SHA']}",
              f"workflow_run_id={os.environ['GITHUB_RUN_ID']}",
              "",
              "```text",
              os.environ.get('TAIL', '')[-12000:],
              "```",
          ])
          print(json.dumps({'body': body}))
          PY
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/107" \
            --data-binary "@$BODY_FILE" >/dev/null
          exit "$STATUS"
