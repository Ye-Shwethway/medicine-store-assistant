name: One-shot Cell Visibility Test Locator Fix
on:
  push:
    branches: [fix/inventory-cell-selection-visibility]
    paths: ['.github/workflows/one-shot-cell-visibility-test-locator.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/inventory-cell-selection-visibility
      - name: Fix strict test locator
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/web/inventory_sheet_selection_smoke.mjs')
          s=p.read_text()
          old="await page.getByText('Alpha',{exact:true}).waitFor();\n\nawait page.addStyleTag({path:stylesheet});"
          new="await cell(0,0).waitFor({state:'visible'});\n\nawait page.addStyleTag({path:stylesheet});"
          if old not in s:
              raise SystemExit('target not found')
          p.write_text(s.replace(old,new,1))
          PY
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add tests/web/inventory_sheet_selection_smoke.mjs
          git commit -m 'Fix strict Sheet Interaction cell locator'
          git push origin HEAD:fix/inventory-cell-selection-visibility
