name: Validate MCP audit proof

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/audit_events.py'
      - 'backend/app/shadow_read_api.py'
      - 'backend/app/main.py'
      - 'backend/app/db.py'
      - 'backend/app/dashboard_assets/dashboard_audit.js'
      - 'backend/app/dashboard_assets/dashboard_audit.css'
      - 'backend/alembic/versions/0015_mcp_audit_events.py'
      - 'backend/alembic/versions/0016_revoke_stale_chatgpt_oauth.py'
      - 'backend/alembic/versions/0017_ai_workspace_access.py'
      - '.github/workflows/validate-mcp-audit.yml'

permissions:
  contents: read

jobs:
  validate-mcp-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/alembic
      - name: Validate audit migration and API contract
        run: |
          PYTHONPATH=backend python - <<'PY'
          import importlib.util
          from pathlib import Path
          from app.db import EXPECTED_MIGRATION
          from app.main import app, AUDIT_ASSET_VERSION

          def load(path, name):
              spec=importlib.util.spec_from_file_location(name, path)
              mod=importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              return mod

          audit=load(Path('backend/alembic/versions/0015_mcp_audit_events.py'),'audit_migration')
          stale_oauth=load(Path('backend/alembic/versions/0016_revoke_stale_chatgpt_oauth.py'),'stale_oauth_migration')
          head=load(Path('backend/alembic/versions/0017_ai_workspace_access.py'),'head_migration')
          assert audit.revision=='0015_mcp_audit'
          assert audit.down_revision=='0014_mcp_agent_bindings'
          assert stale_oauth.down_revision==audit.revision
          assert head.down_revision==stale_oauth.revision
          assert EXPECTED_MIGRATION==head.revision
          assert '/dashboard/api/audit/recent' in set(app.openapi()['paths'])
          assert AUDIT_ASSET_VERSION.startswith('f73a-')
          print('mcp_audit_contract=pass')
          PY
      - name: Validate UI and audit instrumentation contract
        run: |
          node --check backend/app/dashboard_assets/dashboard_audit.js
          grep -Fq 'msa_inventory_read_summary' backend/app/shadow_read_api.py
          grep -Fq 'operation_audit_events' backend/app/audit_events.py
          grep -Fq 'dashboard_audit.js' backend/app/main.py
          grep -Fq 'dashboard_audit.css' backend/app/main.py
          grep -Fq 'no-store, max-age=0' backend/app/main.py
          echo 'mcp_audit_ui_contract=pass'
