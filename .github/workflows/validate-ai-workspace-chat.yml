name: Validate AI Workspace Chat

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/ai_workspace_chat.py'
      - 'backend/app/ai_workspace_access.py'
      - 'backend/app/ai_workspace_attachments.py'
      - 'backend/app/native_agent_runtime.py'
      - 'backend/app/native_agent_tool_runtime.py'
      - 'backend/app/native_agent_tools.py'
      - 'backend/app/multi_agent_review.py'
      - 'backend/app/multi_agent_review_registration.py'
      - 'backend/app/multi_agent_review_ui_api.py'
      - 'backend/app/provider_model_view.py'
      - 'backend/app/main.py'
      - 'backend/app/dashboard_asset_version.py'
      - 'backend/app/db.py'
      - 'backend/app/dashboard_assets/dashboard_ai_workspace.js'
      - 'backend/app/dashboard_assets/dashboard_ai_workspace.css'
      - 'backend/app/dashboard_assets/dashboard_multi_agent_review.js'
      - 'backend/app/dashboard_assets/dashboard_multi_agent_review.css'
      - 'backend/alembic/versions/0018_ai_workspace_conversations.py'
      - 'backend/alembic/versions/0019_ai_workspace_attachments.py'
      - 'backend/alembic/versions/0020_work_review_substrate.py'
      - 'backend/alembic/versions/0021_review_orchestration_roles.py'
      - 'backend/alembic/versions/0022_canonical_inventory_foundation.py'
      - 'backend/alembic/versions/0023_inventory_saved_views.py'
      - '.github/workflows/validate-ai-workspace-chat.yml'

permissions:
  contents: read

jobs:
  validate-ai-workspace-chat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app backend/alembic
      - name: Validate API and migration contract
        run: |
          PYTHONPATH=backend python - <<'PY'
          import importlib.util
          from pathlib import Path
          from app.db import EXPECTED_MIGRATION
          from app.main import app, MULTI_AGENT_REVIEW_ASSET_VERSION

          def load(path, name):
              spec=importlib.util.spec_from_file_location(name, Path(path))
              mod=importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
              return mod

          conversations=load('backend/alembic/versions/0018_ai_workspace_conversations.py','m0018')
          attachments=load('backend/alembic/versions/0019_ai_workspace_attachments.py','m0019')
          substrate=load('backend/alembic/versions/0020_work_review_substrate.py','m0020')
          review_head=load('backend/alembic/versions/0021_review_orchestration_roles.py','m0021')
          inventory_head=load('backend/alembic/versions/0022_canonical_inventory_foundation.py','m0022')
          saved_views_head=load('backend/alembic/versions/0023_inventory_saved_views.py','m0023')
          assert conversations.revision == '0018_ai_workspace_conversations'
          assert attachments.revision == '0019_ai_workspace_attachments'
          assert attachments.down_revision == conversations.revision
          assert substrate.down_revision == attachments.revision
          assert review_head.down_revision == substrate.revision
          assert inventory_head.down_revision == review_head.revision
          assert saved_views_head.down_revision == inventory_head.revision
          assert EXPECTED_MIGRATION == saved_views_head.revision
          assert MULTI_AGENT_REVIEW_ASSET_VERSION.startswith('f72d48-review-ui-')
          assert len(MULTI_AGENT_REVIEW_ASSET_VERSION.removeprefix('f72d48-review-ui-')) == 12

          paths=set(app.openapi()['paths'])
          required={
              '/dashboard/api/ai-workspace/access',
              '/dashboard/api/ai-workspace/chat/agents',
              '/dashboard/api/ai-workspace/conversations',
              '/dashboard/api/ai-workspace/conversation-cards',
              '/dashboard/api/ai-workspace/conversations/{conversation_id}',
              '/dashboard/api/ai-workspace/conversations/{conversation_id}/messages',
              '/dashboard/api/ai-workspace/conversations/{conversation_id}/attachments',
              '/dashboard/api/ai-workspace/conversations/{conversation_id}/attachments/{attachment_id}',
              '/dashboard/api/ai-workspace/conversations/{conversation_id}/attachments/{attachment_id}/content',
              '/dashboard/api/ai-workspace/multi-agent/sessions/{session_id}/roles',
              '/dashboard/api/ai-workspace/multi-agent/reviews',
              '/dashboard/api/ai-workspace/multi-agent/work-items',
              '/dashboard/api/ai-workspace/multi-agent/work-items/{work_item_id}',
              '/dashboard/api/ai-workspace/multi-agent/work-items/{work_item_id}/return-for-revision',
          }
          assert required <= paths, sorted(required-paths)
          print('ai_workspace_chat_review_api=pass')
          PY
      - name: Validate backend security and sequence contract
        run: |
          grep -Fq 'Depends(require_ai_chat_access)' backend/app/ai_workspace_chat.py
          grep -Fq 'owner_user_id=CAST(:owner_user_id AS uuid)' backend/app/ai_workspace_chat.py
          grep -Fq 'Do not reveal whether another user' backend/app/ai_workspace_chat.py
          grep -Fq '_eligible_agent(connection, conversation["agent_id"])' backend/app/ai_workspace_chat.py
          grep -Fq '_agent_read_allowed(agent)' backend/app/ai_workspace_chat.py
          grep -Fq 'run_native_read_tools(requested_tools)' backend/app/ai_workspace_chat.py
          grep -Fq 'principal.get("role") == "OWNER"' backend/app/ai_workspace_chat.py
          grep -Fq "CASE role WHEN 'USER' THEN 0 ELSE 1 END" backend/app/ai_workspace_chat.py
          grep -Fq 'DELETE FROM ai_workspace_conversations' backend/app/ai_workspace_chat.py
          grep -Fq 'WORKSPACE_TOOL_OUTPUT_TOKENS = 4096' backend/app/ai_workspace_chat.py
          grep -Fq 'Do not use Markdown heading markers' backend/app/ai_workspace_chat.py
          grep -Fq 'attachment_processing' backend/app/ai_workspace_chat.py
          grep -Fq 'MAX_ATTACHMENT_BYTES = 8 * 1024 * 1024' backend/app/ai_workspace_attachments.py
          grep -Fq 'MAX_PENDING_ATTACHMENTS = 4' backend/app/ai_workspace_attachments.py
          grep -Fq 'Depends(require_owner_session)' backend/app/multi_agent_review.py
          grep -Fq 'item["runtime_mode"] != "INTERNAL_MODEL"' backend/app/multi_agent_review.py
          grep -Fq '_set_status(connection, work_item_id, "WAITING_OWNER")' backend/app/multi_agent_review.py
          grep -Fq 'SET status=CAST(:target AS varchar)' backend/app/multi_agent_review.py
          ! grep -Fq "completed_at=CASE WHEN :target" backend/app/multi_agent_review.py
          grep -Fq '"production_mutation": False' backend/app/multi_agent_review.py
          grep -Fq 'Depends(require_owner_session)' backend/app/multi_agent_review_ui_api.py
          grep -Fq "w.work_type='NATIVE_REVIEW'" backend/app/multi_agent_review_ui_api.py
          grep -Fq 'CAST(w.created_by_actor_id AS text)=CAST(:owner_user_id AS text)' backend/app/multi_agent_review_ui_api.py
          grep -Fq '"artifact_count": 0' backend/app/multi_agent_review_ui_api.py
          echo 'ai_workspace_review_security=pass'
      - name: Validate Dashboard Chat and Review assets
        run: |
          node --check backend/app/dashboard_assets/dashboard_ai_workspace.js
          node --check backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq 'humanTime' backend/app/dashboard_assets/dashboard_ai_workspace.js
          grep -Fq 'data-copy-message' backend/app/dashboard_assets/dashboard_ai_workspace.js
          grep -Fq 'reviewSessionSelect' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq 'reviewSaveRoles' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq 'rolesSaved' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq "save.textContent=rolesSaved?'Saved':'Save roles'" backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq 'reviewEvidenceConversation' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq '/dashboard/api/ai-workspace/multi-agent/reviews' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq '/dashboard/api/ai-workspace/multi-agent/work-items' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq 'review-chat-stream' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq 'Production mutation: NO' backend/app/dashboard_assets/dashboard_multi_agent_review.js
          grep -Fq '.review-grid' backend/app/dashboard_assets/dashboard_multi_agent_review.css
          grep -Fq '.review-chat-stream' backend/app/dashboard_assets/dashboard_multi_agent_review.css
          grep -Fq '@media(max-width:760px)' backend/app/dashboard_assets/dashboard_multi_agent_review.css
          grep -Fq 'MULTI_AGENT_REVIEW_ASSET_VERSION = asset_bundle_version' backend/app/main.py
          grep -Fq '"dashboard_multi_agent_review.js": "f72d48-review-ui-"' backend/app/dashboard_asset_version.py
          grep -Fq 'dashboard_multi_agent_review.css?v={MULTI_AGENT_REVIEW_ASSET_VERSION}' backend/app/main.py
          grep -Fq 'dashboard_multi_agent_review.js?v={MULTI_AGENT_REVIEW_ASSET_VERSION}' backend/app/main.py
          grep -Fq 'no-store, max-age=0' backend/app/main.py
          echo 'ai_workspace_review_asset_chain=pass'
