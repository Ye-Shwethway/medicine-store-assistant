name: Validate readiness migration head

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/db.py'
      - 'backend/app/readiness_contract_verify.py'
      - 'backend/alembic/**'
      - '.github/workflows/validate-readiness-head.yml'

permissions:
  contents: read

jobs:
  readiness-head-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Verify readiness follows Alembic head
        working-directory: backend
        run: PYTHONPATH=. python -m app.readiness_contract_verify
