name: Validate saved model catalog

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/saved_model_catalog.py'
      - 'backend/app/provider_model_view.py'
      - 'backend/app/main.py'
      - 'backend/app/dashboard_assets/dashboard_saved_models.js'
      - 'backend/app/dashboard_assets/dashboard_saved_models.css'
      - 'backend/alembic/versions/0013_saved_provider_models.py'
      - '.github/workflows/validate-saved-model-catalog.yml'

permissions:
  contents: read

jobs:
  validate-saved-model-catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Compile Python
        run: python -m compileall -q backend/app backend/alembic
      - name: Validate saved-model API contract
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.main import app, SAVED_MODEL_ASSET_VERSION
          paths=set(app.openapi()['paths'])
          required={
            '/dashboard/api/providers/{provider_id}/catalog-models',
            '/dashboard/api/providers/{provider_id}/models/{provider_model_id}/test',
            '/dashboard/api/providers/{provider_id}/models/{provider_model_id}/save',
            '/dashboard/api/providers/{provider_id}/saved-models',
            '/dashboard/api/providers/{provider_id}/saved-models/{saved_model_id}',
            '/dashboard/api/agents/{agent_id}/model-assignment',
          }
          assert required <= paths, sorted(required-paths)
          assert SAVED_MODEL_ASSET_VERSION.startswith('f72d31-')
          print('saved_model_api_contract=pass')
          PY
      - name: Validate dashboard asset delivery contract
        run: |
          node --check backend/app/dashboard_assets/dashboard_saved_models.js
          grep -Fq 'Save to catalog' backend/app/dashboard_assets/dashboard_saved_models.js
          grep -Fq 'Saved model catalog' backend/app/dashboard_assets/dashboard_saved_models.js
          grep -Fq 'agentSavedModelId' backend/app/dashboard_assets/dashboard_saved_models.js
          grep -Fq 'dashboard_saved_models.js' backend/app/main.py
          grep -Fq 'dashboard_saved_models.css' backend/app/main.py
          grep -Fq 'no-store, max-age=0' backend/app/main.py
          echo 'saved_model_ui_contract=pass'
      - name: Validate migration chain
        run: |
          PYTHONPATH=backend python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('backend/alembic/versions/0013_saved_provider_models.py')
          spec=importlib.util.spec_from_file_location('m',p);m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m)
          assert m.revision=='0013_saved_models'
          assert m.down_revision=='0012_providers'
          print('saved_model_migration_chain=pass')
          PY
