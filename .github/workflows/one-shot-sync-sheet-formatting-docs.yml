name: One-shot Sync Sheet Formatting Docs
on:
  push:
    branches: [feat/inventory-sheet-formatting-v1]
    paths: ['.github/workflows/one-shot-sync-sheet-formatting-docs.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/inventory-sheet-formatting-v1
      - name: Sync continuity docs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          road=Path('ROADMAP.md')
          s=road.read_text()
          s=s.replace('## Inventory Sheet Interaction Foundation v1 — ACTIVE','## Inventory Sheet Interaction Foundation v1 — COMPLETE + PRODUCTION VERIFIED',1)
          marker='## Inventory Sheet Formatting v1 — IMPLEMENTED + CI VERIFIED'
          if marker not in s:
              s += '''\n\n## Inventory Sheet Formatting v1 — IMPLEMENTED + CI VERIFIED\n\nContract: `docs/design/INVENTORY_SHEET_FORMATTING_V1.md`. PR #203 adds session-only spreadsheet presentation formatting over the existing authoritative Inventory renderer.\n\nImplemented behavior:\n\n- bounded Fill palette: Yellow, Light green, Light red, Light blue, Orange and Gray;\n- apply fill to one cell, a rectangular range, or selected whole rows across visible registered columns;\n- Clear fill affects only the current selection;\n- formatting identity is semantic `(rowIdentity, fieldKey)` rather than DOM position, so sort/re-render does not move color to the wrong row/field;\n- REVIEW / CONFLICT system semantics remain independently visible through status text plus warning stripe;\n- active/selected cell outline remains visible over user fill;\n- Copy TSV remains value-only;\n- Ask AI / Deep Review remain whole-row-only and formatting metadata is not review evidence;\n- mobile 390x844 Fill palette behavior is covered by Playwright;\n- formatting remains session-only. Persistence/export of user formatting is deferred to Saved Custom Views / View Builder.\n\nCI at PR #203 is green for backend, Web reliability and Inventory View Engine, including the dedicated Sheet Formatting browser smoke. Production merge/deploy evidence is pending. No inventory, CMS mapping, pricing, migration-baseline or canonicality mutation is introduced.\n'''
          road.write_text(s)

          plan=Path('IMPLEMENTATION_PLAN.md')
          s=plan.read_text()
          for text in [
              'Single click/tap selects a data cell without opening details.',
              'Desktop pointer drag and Shift+click create a rectangular range.',
              'Arrow keys move the active cell; Shift+Arrow extends the range.',
              'Dedicated row-selector gutter selects one/contiguous whole rows.',
              'Explicit Details / Enter opens the selected row drawer.',
              'Copy TSV supports selected cell rectangles and whole rows.',
              'Ask AI / Deep Review remain whole-row-only and server-rehydrated.',
              'Mobile 390x844 tap/scroll behavior is proven.',
              'No mutation/canonicality change.',
          ]:
              s=s.replace(f'- [ ] {text}',f'- [x] {text}',1)
          marker='### 5.6B Inventory Sheet Formatting v1 — IMPLEMENTED + CI VERIFIED'
          if marker not in s:
              s += '''\n\n### 5.6B Inventory Sheet Formatting v1 — IMPLEMENTED + CI VERIFIED\n\n- [x] Session-only formatting metadata keyed by stable row identity + registered field key.\n- [x] Fill one cell, rectangular ranges, and selected whole rows across visible registered columns.\n- [x] Bounded accessible palette: Yellow, Light green, Light red, Light blue, Orange, Gray.\n- [x] Clear fill for the current selection only.\n- [x] Preserve active/selected cell outline over user fill.\n- [x] Preserve REVIEW / CONFLICT system signal independently from user fill.\n- [x] Preserve formatting identity through sort/re-render.\n- [x] Keep Copy TSV value-only and AI review formatting-blind.\n- [x] Prove mobile 390x844 Fill palette behavior.\n- [x] No inventory/CMS/baseline/canonicality mutation.\n- [ ] Persist formatting only when Saved Custom Views / View Builder owns the user view definition.\n- [ ] Export persisted custom-view formatting through the existing reusable Excel renderer only after the persistence contract is defined.\n\nContract: `docs/design/INVENTORY_SHEET_FORMATTING_V1.md`. PR #203 CI is green; production deployment evidence is pending.\n'''
          plan.write_text(s)

          boot=Path('NEW_CHAT_BOOTSTRAP.md')
          s=boot.read_text()
          marker='## Latest Inventory Sheet Formatting checkpoint'
          if marker not in s:
              s += '''\n\n## Latest Inventory Sheet Formatting checkpoint\n\nInventory Sheet Interaction Foundation v1 is production-verified through PR #202 / main `3e94b8496c9d8e9cfcd7da54415b1307e0b7a9ed`, including visible active-cell selection state.\n\nThe next slice, Inventory Sheet Formatting v1, is implemented on PR #203 and CI-verified. It adds session-only fill formatting for cells/ranges/whole rows with a bounded six-color palette and Clear fill. Formatting is keyed by stable row identity + registered field, system REVIEW/CONFLICT signals remain visible, Copy TSV remains value-only, and Ask AI / Deep Review remain whole-row/server-rehydrated. Persistent formatting and styled custom-view export belong to Saved Custom Views / View Builder, not this slice. Production merge/deploy evidence for PR #203 is pending.\n\nAuthority remains unchanged: Google/source documents operationally authoritative; PostgreSQL shadow/noncanonical; `database_canonical=false`; `migration_baseline_accepted=false`; no inventory/CMS/price mutation authorized by this work.\n'''
          boot.write_text(s)
          PY
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add ROADMAP.md IMPLEMENTATION_PLAN.md NEW_CHAT_BOOTSTRAP.md
          git commit -m 'Sync docs for Inventory Sheet Formatting v1'
          git push origin HEAD:feat/inventory-sheet-formatting-v1
