name: Validate MCP schema v2

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/mcp_server.py'
      - 'backend/app/mcp_shadow_reads.py'
      - 'backend/app/mcp_schema_v2.py'
      - 'backend/app/mcp_schema_v2_finalize.py'
      - 'backend/app/mcp_schema_v21.py'
      - 'backend/app/mcp_schema_v22_federated.py'
      - 'backend/app/federated_review.py'
      - '.github/workflows/validate-mcp-schema-v2.yml'
      - 'docs/architecture/F7_2D0_MCP_SCHEMA_FINALIZATION_V2.md'

permissions:
  contents: read

jobs:
  validate-mcp-schema-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Compile MCP modules
        run: python -m compileall -q backend/app
      - name: Validate finalized runtime tool catalog
        run: |
          PYTHONPATH=backend python - <<'PY'
          import app.main  # noqa: F401; constructs the production MCP application
          from app.mcp_server import mcp
          from app.mcp_schema_v2 import FINAL_TOOL_COUNT, FINAL_TOOL_HASH, FINAL_TOOL_NAMES, SCHEMA_VERSION

          runtime_names = tuple(sorted(tool.name for tool in mcp._tool_manager.list_tools()))
          assert SCHEMA_VERSION == '2026-08-24.v2.2'
          assert FINAL_TOOL_COUNT == 108, FINAL_TOOL_COUNT
          assert len(runtime_names) == 108, len(runtime_names)
          assert runtime_names == FINAL_TOOL_NAMES, (set(runtime_names) ^ set(FINAL_TOOL_NAMES))
          assert len(FINAL_TOOL_HASH) == 64
          required = {
              'msa_shadow_read_rows',
              'msa_system_schema_manifest',
              'msa_agent_invoke',
              'msa_agent_sessions_manage',
              'msa_locations_manage',
              'msa_inventory_write_operation',
              'msa_catalogue_manage',
              'msa_reconciliation_commit',
              'msa_external_clients_manage',
              'msa_providers_lifecycle',
              'msa_reports_query',
              'msa_automations_manage',
              'msa_alerts_query',
              'msa_sync_manage',
              'msa_migration_control',
              'msa_inventory_read_usage',
              'msa_federated_review_query',
              'msa_federated_review_submit',
          }
          assert required <= set(runtime_names), required - set(runtime_names)
          assert 'msa_agents_rotate_credential' not in runtime_names
          forbidden_name_fragments = ('password', 'credential', 'secret', 'raw_sql', 'sql_console', 'shell', 'filesystem')
          assert not [name for name in runtime_names if any(fragment in name for fragment in forbidden_name_fragments)]
          print(f'mcp_schema_v22=pass version={SCHEMA_VERSION} count={len(runtime_names)} hash={FINAL_TOOL_HASH}')
          PY
      - name: Validate registration happens before transport construction
        run: |
          python - <<'PY'
          from pathlib import Path
          server = Path('backend/app/mcp_server.py').read_text()
          shadow = Path('backend/app/mcp_shadow_reads.py').read_text()
          assert server.index('import app.mcp_shadow_reads') < server.index('mcp_http_app = mcp.streamable_http_app')
          assert shadow.index('import app.mcp_schema_v2 ') < shadow.index('import app.mcp_schema_v2_finalize ')
          assert shadow.index('import app.mcp_schema_v2_finalize ') < shadow.index('import app.mcp_schema_v21 ')
          assert shadow.index('import app.mcp_schema_v21 ') < shadow.index('import app.mcp_schema_v22_federated ')
          print('mcp_schema_registration_order=pass')
          PY
      - name: Validate open action schemas and exclusions
        run: |
          PYTHONPATH=backend python - <<'PY'
          import app.main  # noqa: F401
          from app.mcp_server import mcp

          open_action_tools = (
              'msa_catalogue_query', 'msa_reconciliation_query', 'msa_transfer_query',
              'msa_locations_manage', 'msa_agent_sessions_manage', 'msa_providers_catalog_manage',
              'msa_alerts_manage', 'msa_notifications_manage', 'msa_sync_manage',
              'msa_sources_manage', 'msa_integrations_manage', 'msa_migration_control',
              'msa_federated_review_query',
          )
          tools = {tool.name: tool for tool in mcp._tool_manager.list_tools()}
          for name in open_action_tools:
              schema = tools[name].parameters
              action_schema = schema['properties']['action']
              assert action_schema['type'] == 'string', (name, action_schema)
              assert 'enum' not in action_schema, name
          submit_schema = tools['msa_federated_review_submit'].parameters['properties']
          for field in ('work_item_id','request_artifact_id','artifact_id','artifact_version','verdict','notes'):
              assert field in submit_schema, field
          assert 'msa_agents_rotate_credential' not in tools
          print('mcp_open_action_schema=pass')
          PY
      - name: Validate policy boundaries
        run: |
          python - <<'PY'
          from pathlib import Path
          docs = Path('docs/architecture/F7_2D0_MCP_SCHEMA_FINALIZATION_V2.md').read_text()
          finalizer = Path('backend/app/mcp_schema_v2_finalize.py').read_text()
          hardening = Path('backend/app/mcp_schema_v21.py').read_text()
          federation = Path('backend/app/mcp_schema_v22_federated.py').read_text()
          assert 'credential management' in finalizer
          assert 'mcp.remove_tool("msa_agents_rotate_credential")' in finalizer
          assert 'backend allowlists' in hardening
          assert 'mcp:propose' in Path('backend/app/federated_review.py').read_text()
          assert 'artifact_version: int' in federation
          assert 'arbitrary SQL' in docs
          assert 'provider API-key / credential provisioning' in docs
          assert 'Production inventory writes and control-plane system gates remain closed' in docs
          print('mcp_schema_v22_boundaries=pass')
          PY
