name: One-shot Saved View Deploy Proof
on:
  push:
    branches:
      - feat/f6e-saved-view-persistence
    paths:
      - .github/workflows/one-shot-saved-view-deploy-proof.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/f6e-saved-view-persistence
      - name: Patch deploy proof
        run: |
          python scripts/patch_saved_view_deploy.py
          bash -n deploy/apply_backend.sh
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add deploy/apply_backend.sh
          git commit -m 'Verify Inventory saved views during deploy'
          git push origin HEAD:feat/f6e-saved-view-persistence
