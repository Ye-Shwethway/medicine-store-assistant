name: Validate native internal agent read tools

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/app/native_agent_tools.py'
      - 'backend/app/native_agent_tools_verify.py'
      - 'backend/app/native_agent_runtime.py'
      - 'backend/app/ai_workspace_chat.py'
      - 'backend/app/main.py'
      - 'backend/app/dashboard_assets/dashboard_ai_workspace.css'
      - '.github/workflows/validate-native-agent-tools.yml'

permissions:
  contents: read

jobs:
  validate-native-agent-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install backend requirements
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend/app
      - name: Validate grounded read-tool contract
        run: PYTHONPATH=backend python backend/app/native_agent_tools_verify.py
      - name: Validate AI Workspace styling contract
        run: |
          grep -Fq '.ai-chat-form button' backend/app/dashboard_assets/dashboard_ai_workspace.css
          grep -Fq 'background:var(--accent)' backend/app/dashboard_assets/dashboard_ai_workspace.css
          grep -Fq 'f72d4f-read-only-bounded' backend/app/main.py
          echo 'native_agent_tool_ui_contract=pass'
