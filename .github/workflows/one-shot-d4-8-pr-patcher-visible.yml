name: One-shot D4.8 live/export asset patcher

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/checkpoints/d4-8-live-export-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/d4-8-review-live-and-export'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/d4-8-review-live-and-export
          fetch-depth: 0
          persist-credentials: true
      - name: Apply asserted asset registration patch
        run: |
          set -euo pipefail
          python scripts/d4_8_live_export_main_patch.py
          python -m compileall -q backend/app
          node --check backend/app/dashboard_assets/dashboard_multi_agent_review.js
          node --check backend/app/dashboard_assets/dashboard_multi_agent_live_export.js
          git diff --check
          git config user.name 'MSA D4.8 Live Export'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Register D4.8 live Review and export assets'
          git push origin HEAD:feat/d4-8-review-live-and-export
