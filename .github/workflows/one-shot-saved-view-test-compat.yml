name: One-shot Saved View Test Compatibility
on:
  push:
    branches:
      - feat/f6e-saved-view-persistence
    paths:
      - .github/workflows/one-shot-saved-view-test-compat.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/f6e-saved-view-persistence
      - name: Patch legacy browser mocks
        run: |
          python scripts/patch_saved_view_test_compat.py
          for file in tests/web/inventory_view_engine_smoke.mjs tests/web/inventory_sorting_smoke.mjs tests/web/inventory_excel_export_smoke.mjs tests/web/inventory_date_format_smoke.mjs tests/web/inventory_sheet_selection_smoke.mjs tests/web/inventory_sheet_formatting_smoke.mjs; do node --check "$file"; done
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add tests/web/inventory_view_engine_smoke.mjs tests/web/inventory_sorting_smoke.mjs tests/web/inventory_excel_export_smoke.mjs tests/web/inventory_date_format_smoke.mjs tests/web/inventory_sheet_selection_smoke.mjs tests/web/inventory_sheet_formatting_smoke.mjs
          if git diff --cached --quiet; then echo 'No compatibility changes needed'; exit 0; fi
          git commit -m 'Keep Inventory browser mocks compatible with saved views'
          git push origin HEAD:feat/f6e-saved-view-persistence
# rerun after tolerant patcher
