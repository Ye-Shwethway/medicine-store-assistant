name: One-shot Fix No Fill A11y
on:
  push:
    branches: [fix/inventory-fill-runtime-ux]
    paths: ['.github/workflows/one-shot-fix-no-fill-a11y.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/inventory-fill-runtime-ux
      - name: Stabilize No fill accessibility and smoke
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p=Path('backend/app/dashboard_assets/dashboard_inventory_views.js')
          s=p.read_text()
          old='<button class="inventory-fill-none" id="inventoryClearFill" type="button" role="menuitem">No fill</button>'
          new='<button class="inventory-fill-none" id="inventoryClearFill" type="button" role="menuitem" aria-label="No fill">No fill</button>'
          if s.count(old)!=1: raise SystemExit('No fill markup anchor mismatch')
          p.write_text(s.replace(old,new,1))

          p=Path('tests/web/inventory_sheet_formatting_smoke.mjs')
          s=p.read_text()
          old="await page.getByRole('menuitem',{name:'No fill',exact:true}).click();"
          new="assert.equal(await page.locator('#inventoryClearFill').getAttribute('aria-label'),'No fill');\nawait page.locator('#inventoryClearFill').click();"
          if s.count(old)!=1: raise SystemExit('No fill smoke anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          node --check tests/web/inventory_sheet_formatting_smoke.mjs
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add backend/app/dashboard_assets/dashboard_inventory_views.js tests/web/inventory_sheet_formatting_smoke.mjs
          git commit -m 'Stabilize Inventory No fill accessibility'
          git push origin HEAD:fix/inventory-fill-runtime-ux
