name: One-shot Sync Inventory Fill Hotfix Docs
on:
  push:
    branches: [docs/inventory-fill-hotfix-runtime]
    paths: ['.github/workflows/one-shot-sync-inventory-fill-hotfix-docs.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/inventory-fill-hotfix-runtime
      - name: Record production fill hotfix evidence
        run: |
          python3 - <<'PY'
          from pathlib import Path
          sha='66a45963d5605f2699545cd35e24aa1dd2571152'
          run='32834067245'
          pr='205'

          p=Path('ROADMAP.md')
          s=p.read_text()
          marker='### Inventory Sheet Formatting v1 — production fill runtime hotfix'
          if marker not in s:
              s += f'''\n\n{marker}\n\nPR #{pr} supersedes the original fill presentation behavior from PR #203 after production observation showed that fill metadata could exist without a visible cell color and that expanded color choices were visually confusable with native workbench actions. The hotfix keeps formatting session-only/read-only, applies the selected fill as authoritative inline presentation style with `!important`, gives the Fill trigger a distinct formatting marker/disclosure treatment, renders color choices as compact derived swatch tiles rather than native `.secondary` actions, and keeps `No fill` inside the formatting popover. Exact production main SHA `{sha}` deployed successfully via run `{run}`; deployment issue #26 published `status=success` with the same source SHA. No inventory, CMS mapping, pricing, migration-baseline or canonicality mutation was introduced.\n'''
          p.write_text(s)

          p=Path('IMPLEMENTATION_PLAN.md')
          s=p.read_text()
          marker='#### Sheet Formatting v1 production hotfix — COMPLETE + PRODUCTION VERIFIED'
          if marker not in s:
              s += f'''\n\n{marker}\n\n- [x] Make user fill visibly authoritative over competing table/frozen/system background CSS using inline presentation style with `important` priority.\n- [x] Preserve active-cell/selection outlines and REVIEW/CONFLICT semantic stripes above/alongside user fill.\n- [x] Distinguish the Fill trigger from native workbench actions with a formatting marker and disclosure affordance.\n- [x] Render derived color presets as compact swatch tiles rather than `.secondary` action buttons.\n- [x] Keep `No fill` inside the formatting popover with explicit accessible labeling.\n- [x] Stabilize browser proof for interaction, actual fill priority/visibility, row/range fill, clear fill, sort identity and mobile palette.\n- [x] PR #{pr} merged as `{sha}`; deploy run `{run}` succeeded; issue #26 confirmed the exact deployed SHA.\n'''
          p.write_text(s)

          p=Path('NEW_CHAT_BOOTSTRAP.md')
          s=p.read_text()
          marker='## Inventory Fill runtime hotfix checkpoint'
          if marker not in s:
              s += f'''\n\n{marker}\n\nProduction observation after Sheet Formatting v1 found two issues: user fill could be stored without an obvious visible cell color, and expanded color controls looked too much like normal native actions. PR #{pr} fixed both. Current production fill rendering uses authoritative inline background presentation with `important` priority; the Fill control has a distinct formatting marker; the palette uses derived swatch tiles rather than native `.secondary` buttons; `No fill` is a separated in-popover action; system warning stripes and selection outlines remain independently visible. PR #{pr} merged as `{sha}` and deploy run `{run}` succeeded; deployment issue #26 confirms the exact source SHA. Formatting remains session-only/read-only and is not inventory or AI-review evidence.\n'''
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add ROADMAP.md IMPLEMENTATION_PLAN.md NEW_CHAT_BOOTSTRAP.md
          git commit -m 'Record Inventory fill production hotfix proof'
          git push origin HEAD:docs/inventory-fill-hotfix-runtime
