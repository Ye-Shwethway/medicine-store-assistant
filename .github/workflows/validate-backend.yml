name: Validate backend changes

on:
  push:
    branches: [test]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/validate-backend.yml'
      - '.github/workflows/deploy-f5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/validate-backend.yml'
      - '.github/workflows/deploy-f5.yml'

permissions:
  contents: read

jobs:
  targeted-backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository contract
        run: python scripts/validate_repository.py
      - name: Compile backend Python
        run: python -m compileall -q backend/app backend/alembic
      - name: Validate MCP and control-plane runtime imports
        run: |
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
          PYTHONPATH=backend python -c 'from app.main import app; from app.mcp_server import mcp, mcp_http_app; from app.agent_management import router as agent_router; from app.provider_registry import router as provider_router; from app.nanogpt_catalog import router as nanogpt_router; assert app and mcp and mcp_http_app and agent_router and provider_router and nanogpt_router; print("mcp_runtime_import=pass agent_management_import=pass provider_registry_import=pass nanogpt_catalog_import=pass")'
      - name: Validate MCP OAuth contract
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.main import app
          from app.mcp_oauth import _metadata, _pkce_challenge, router as oauth_router
          metadata = _metadata()
          assert metadata["authorization_endpoint"].endswith("/oauth/authorize")
          assert metadata["token_endpoint"].endswith("/oauth/token")
          assert metadata["registration_endpoint"].endswith("/oauth/register")
          assert "authorization_code" in metadata["grant_types_supported"]
          assert "refresh_token" in metadata["grant_types_supported"]
          assert "offline_access" in metadata["scopes_supported"]
          assert "S256" in metadata["code_challenge_methods_supported"]
          assert _pkce_challenge("A" * 43)
          openapi_paths = set(app.openapi()["paths"])
          for path in {
              "/oauth/authorize",
              "/oauth/authorize/login",
              "/oauth/register",
              "/oauth/token",
              "/oauth/revoke",
          }:
              assert path in openapi_paths, (path, sorted(openapi_paths))
          router_paths = {getattr(route, "path", None) for route in oauth_router.routes}
          assert "/.well-known/oauth-authorization-server/oauth" in router_paths
          print("mcp_oauth_contract=pass")
          PY
      - name: Validate F7.2D2 API contract
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.main import app
          from app.agent_management import AgentCreate, SessionCreate, SessionParticipantInput
          paths = set(app.openapi()["paths"])
          required = {
              "/dashboard/api/agents",
              "/dashboard/api/agents/{agent_id}",
              "/dashboard/api/agents/{agent_id}/disable",
              "/dashboard/api/agents/{agent_id}/reactivate",
              "/dashboard/api/agents/{agent_id}/revoke",
              "/dashboard/api/agents/sessions/list",
              "/dashboard/api/agents/sessions",
              "/dashboard/api/agents/sessions/{session_id}",
              "/dashboard/api/agents/sessions/{session_id}/close",
              "/dashboard/api/agents/sessions/{session_id}/reopen",
          }
          assert required <= paths, sorted(required - paths)
          a = AgentCreate(display_name="Analyst", call_name="Mira")
          assert a.capability_scopes == ["mcp:read"]
          s = SessionCreate(session_name="Compare", mode="COMPARE", participants=[SessionParticipantInput(agent_id="00000000-0000-0000-0000-000000000001", position=0)])
          assert s.mode == "COMPARE" and len(s.participants) == 1
          print("f7_2d2_api_contract=pass")
          PY
      - name: Validate F7.2D3 Provider Registry contract
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.main import app
          from app.provider_registry import ProviderCreate, _normalize_openai_model, _normalize_gemini_model
          paths = set(app.openapi()["paths"])
          required = {
              "/dashboard/api/providers",
              "/dashboard/api/providers/{provider_id}",
              "/dashboard/api/providers/{provider_id}/credential",
              "/dashboard/api/providers/{provider_id}/test",
              "/dashboard/api/providers/{provider_id}/models/fetch",
              "/dashboard/api/providers/{provider_id}/models",
              "/dashboard/api/providers/{provider_id}/enable",
              "/dashboard/api/providers/{provider_id}/disable",
              "/dashboard/api/providers/{provider_id}/nanogpt/models/fetch-detailed",
          }
          assert required <= paths, sorted(required - paths)
          p = ProviderCreate(display_name="OpenAI", provider_kind="OPENAI")
          assert p.provider_kind == "OPENAI"
          o = _normalize_openai_model({"id":"vendor/model","architecture":{"input_modalities":["text","image"]},"supported_parameters":["tools","response_format"]})
          assert o and o["supports_vision"] is True and o["supports_tools"] is True and o["supports_structured_output"] is True
          g = _normalize_gemini_model({"name":"models/gemini-test","supportedGenerationMethods":["generateContent"],"inputTokenLimit":1000})
          assert g and g["model_id"] == "gemini-test" and g["supports_text"] is True
          print("f7_2d3_provider_contract=pass")
          PY
      - name: Validate NanoGPT detailed catalog normalization
        run: |
          PYTHONPATH=backend python - <<'PY'
          from app.nanogpt_catalog import _normalize_catalog
          payload = {"data": [{
              "id": "deepseek/deepseek-v4-flash",
              "name": "DeepSeek V4 Flash",
              "description": "Synthetic CI model",
              "context_length": 131072,
              "max_output_tokens": 8192,
              "capabilities": {"vision": False, "reasoning": True, "tool_calling": True, "structured_output": True},
              "pricing": {"prompt": 0.25, "completion": 0.75, "currency": "USD", "unit": "per_million_tokens"},
          }]}
          items = _normalize_catalog(payload, {"deepseek/deepseek-v4-flash"}, set())
          item = items[0]
          assert item["supports_text"] is True
          assert item["supports_vision"] is False
          assert item["supports_tools"] is True
          assert item["supports_structured_output"] is True
          assert item["context_window"] == 131072
          assert item["provider_metadata"]["pricing"]["prompt"] == 0.25
          assert item["provider_metadata"]["billing_tier"] == "SUBSCRIPTION_INCLUDED"
          print("nanogpt_detailed_catalog_contract=pass")
          PY
      - name: Validate dashboard JavaScript syntax
        run: |
          node --check backend/app/dashboard_assets/dashboard.js
          node --check backend/app/dashboard_assets/dashboard_recovery.js
          node --check backend/app/dashboard_assets/dashboard_agents.js
          node --check backend/app/dashboard_assets/login.js
      - name: Validate dashboard Agent and Provider UI contract
        run: |
          grep -Fq 'AI Agent Management' backend/app/dashboard_assets/dashboard.html
          grep -Fq 'Create agent' backend/app/dashboard_assets/dashboard.html
          grep -Fq 'Multi-agent sessions' backend/app/dashboard_assets/dashboard.html
          grep -Fq 'External / MCP agents' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Internal / provider-backed agents' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Provider Registry' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq "classList.add('secondary')" backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Search model name or ID' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Subscription included' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Paid only' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Input:' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'Output:' backend/app/dashboard_assets/dashboard_agents.js
          grep -Fq 'dashboard_agents.js' backend/app/dashboard_assets/dashboard.html
          grep -Fq 'dashboard_agents.css' backend/app/dashboard_assets/dashboard.html
          echo 'f7_2d2_d3_ui_contract=pass'
      - name: Validate deployment shell syntax
        run: |
          set -euo pipefail
          for script in deploy/*.sh; do
            bash -n "$script"
          done
