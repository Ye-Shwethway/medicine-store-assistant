name: Validate backend changes

on:
  push:
    branches: [test]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/validate-backend.yml'
      - '.github/workflows/deploy-f5.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/validate-backend.yml'
      - '.github/workflows/deploy-f5.yml'

permissions:
  contents: read

jobs:
  targeted-backend-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate repository contract
        run: python scripts/validate_repository.py
      - name: Compile backend Python
        run: python -m compileall -q backend/app backend/alembic
      - name: Validate dashboard JavaScript syntax
        run: node --check backend/app/dashboard_assets/dashboard.js
      - name: Validate deployment shell syntax
        run: |
          set -euo pipefail
          for script in deploy/*.sh; do
            bash -n "$script"
          done
