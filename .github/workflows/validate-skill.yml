name: Validate Git-backed plugin

on:
  push:
    branches: [test]
    paths:
      - 'skills/**'
      - 'scripts/validate_repository.py'
      - '.codex-plugin/**'
      - '.agents/**'
      - 'VERSION'
      - 'NORMAL_CHAT_BOOTSTRAP.md'
      - '.github/workflows/validate-skill.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**'
      - 'scripts/validate_repository.py'
      - '.codex-plugin/**'
      - '.agents/**'
      - 'VERSION'
      - 'NORMAL_CHAT_BOOTSTRAP.md'
      - '.github/workflows/validate-skill.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate plugin package
        run: python scripts/validate_repository.py
