name: One-shot F6E Sheet Selection Patcher

on:
  push:
    branches:
      - feat/f6e-sheet-selection-foundation
    paths:
      - '.github/workflows/f6e-sheet-selection-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/f6e-sheet-selection-foundation
      - name: Clear stale coordinate selections
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('backend/app/dashboard_assets/dashboard_inventory_views.js')
          text=path.read_text(encoding='utf-8')
          replacements={
            "else if(key==='sort'){state.sortField='';state.sortDir='';state.selected.clear();drawer.hidden=true}state.offset=0;renderActiveFilters();load()":"else if(key==='sort'){state.sortField='';state.sortDir='';drawer.hidden=true}state.offset=0;clearSheetSelection();renderActiveFilters();load()",
            "reviewReason.value='';state.offset=0;renderActiveFilters();load()":"reviewReason.value='';state.offset=0;clearSheetSelection();renderActiveFilters();load()",
            "state.columns=null;state.columnWidths={};columnsPanel.hidden=true;load()":"state.columns=null;state.columnWidths={};clearSheetSelection();columnsPanel.hidden=true;load()",
            "state.offset=0;columnsPanel.hidden=true;load()":"state.offset=0;clearSheetSelection();columnsPanel.hidden=true;load()",
          }
          for old,new in replacements.items():
              assert old in text, old
              text=text.replace(old,new,1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify source
        run: |
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          git diff --check
      - name: Commit interaction fix
        run: |
          git config user.name "MSA Sheet Patcher"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/dashboard_assets/dashboard_inventory_views.js
          git commit -m "Clear stale Inventory sheet selections"
          git push origin HEAD:feat/f6e-sheet-selection-foundation
