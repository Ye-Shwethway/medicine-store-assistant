name: One-shot F6E Sheet Selection Patcher

on:
  push:
    branches:
      - feat/f6e-sheet-selection-foundation
    paths:
      - '.github/workflows/f6e-sheet-selection-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/f6e-sheet-selection-foundation
      - name: Normalize TSV row separators
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path('backend/app/dashboard_assets/dashboard_inventory_views.js')
          text=path.read_text(encoding='utf-8')
          old="rows.join('\\\\n')"
          old2=".join('\\\\n');count=indices.length"
          assert old in text
          assert old2 in text
          text=text.replace(old,"rows.join('\\n')",1)
          text=text.replace(old2,".join('\\n');count=indices.length",1)
          path.write_text(text,encoding='utf-8')
          PY
      - name: Verify source
        run: |
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          git diff --check
      - name: Commit semantic fix
        run: |
          git config user.name "MSA Sheet Patcher"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/dashboard_assets/dashboard_inventory_views.js
          git commit -m "Fix Inventory TSV range row separators"
          git push origin HEAD:feat/f6e-sheet-selection-foundation
