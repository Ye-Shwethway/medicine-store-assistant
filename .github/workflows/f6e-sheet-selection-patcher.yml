name: One-shot F6E Sheet Selection Patcher

on:
  push:
    branches:
      - feat/f6e-sheet-selection-foundation
    paths:
      - '.github/workflows/f6e-sheet-selection-patcher.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v5
        with:
          ref: feat/f6e-sheet-selection-foundation
      - name: Apply Sheet Interaction v1 patch
        run: |
          python scripts/patch_inventory_sheet_selection_v1.py
          python scripts/fix_sheet_selection_escape.py
          python - <<'PY'
          from pathlib import Path
          for name in ('ROADMAP.md','IMPLEMENTATION_PLAN.md','NEW_CHAT_BOOTSTRAP.md'):
              path=Path(name)
              path.write_text(path.read_text(encoding='utf-8').rstrip()+'\n',encoding='utf-8')
          PY
          git checkout -- .github/workflows/validate-inventory-view-engine.yml
      - name: Verify patched source
        run: |
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          git diff --check
      - name: Commit implementation only
        run: |
          git config user.name "MSA Sheet Patcher"
          git config user.email "actions@users.noreply.github.com"
          git add backend/app/dashboard_assets/dashboard_inventory_views.js \
                  tests/web/inventory_sheet_selection_smoke.mjs \
                  design-system/medicine-store-assistant/pages/dashboard.md \
                  docs/design/WEB_SURFACE_OWNERSHIP.md \
                  ROADMAP.md IMPLEMENTATION_PLAN.md NEW_CHAT_BOOTSTRAP.md
          git commit -m "Implement Inventory Sheet Interaction Foundation v1"
          git push origin HEAD:feat/f6e-sheet-selection-foundation
