name: One-shot Fix Fill Trigger A11y
on:
  push:
    branches: [fix/inventory-fill-runtime-ux]
    paths: ['.github/workflows/one-shot-fix-fill-trigger-a11y.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/inventory-fill-runtime-ux
      - name: Stabilize Fill trigger accessible name
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/app/dashboard_assets/dashboard_inventory_views.js')
          s=p.read_text()
          old='id="inventoryFillToggle" type="button" aria-expanded="false" aria-haspopup="menu">Fill</button>'
          new='id="inventoryFillToggle" type="button" aria-label="Fill color" aria-expanded="false" aria-haspopup="menu">Fill</button>'
          if s.count(old)!=1: raise SystemExit('fill trigger anchor mismatch')
          p.write_text(s.replace(old,new,1))
          PY
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add backend/app/dashboard_assets/dashboard_inventory_views.js
          git commit -m 'Stabilize Inventory fill trigger accessibility'
          git push origin HEAD:fix/inventory-fill-runtime-ux
