name: Temporary Inventory format docs sync

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-sync-inventory-format-docs.yml']

permissions:
  contents: write

jobs:
  sync-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: docs/inventory-format-polish-sync
          fetch-depth: 0
      - name: Sync continuity docs
        run: python scripts/sync_inventory_format_docs.py
      - name: Commit docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ROADMAP.md IMPLEMENTATION_PLAN.md NEW_CHAT_BOOTSTRAP.md docs/architecture/REUSABLE_EXCEL_EXPORT.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Sync Inventory display and export formatting docs"
          git push origin HEAD:docs/inventory-format-polish-sync
