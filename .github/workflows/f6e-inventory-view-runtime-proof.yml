name: F6E Inventory View runtime proof

on:
  push:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'backend/app/inventory_view_engine.py'
      - 'backend/app/inventory_view_export.py'
      - 'backend/app/tabular_excel_export.py'
      - 'backend/app/inventory_view_runtime_verify.py'
      - '.github/workflows/f6e-inventory-view-runtime-proof.yml'
  workflow_dispatch:

# Keep this workflow as the runtime acceptance proof for the read-only configurable Inventory View substrate.
permissions:
  contents: read
  issues: write

jobs:
  runtime-proof:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: source
          persist-credentials: false

      - name: Run read-only Inventory View verifier
        id: verify
        continue-on-error: true
        shell: bash
        working-directory: source
        run: |
          set -o pipefail
          ENV_FILE=/opt/medicine-store-assistant/secrets/runtime.env
          COMPOSE_FILE="$PWD/deploy/docker-compose.yml"
          test -r "$ENV_FILE"
          export COMPOSE_PROJECT_NAME="${MSA_COMPOSE_PROJECT_NAME:-deploy}"
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" build api
          docker compose --env-file "$ENV_FILE" -f "$COMPOSE_FILE" run --rm api \
            python -m app.inventory_view_runtime_verify 2>&1 | tee "${RUNNER_TEMP}/f6e-inventory-view-runtime.txt"

      - name: Publish runtime evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVIDENCE_ISSUE: '166'
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          export VERIFY_FILE="${RUNNER_TEMP}/f6e-inventory-view-runtime.txt"
          BODY_FILE="${RUNNER_TEMP}/f6e-inventory-view-runtime-body.json"
          python3 - <<'PY' > "$BODY_FILE"
          import json, os
          from pathlib import Path
          path = Path(os.environ['VERIFY_FILE'])
          evidence = path.read_text(encoding='utf-8').strip() if path.exists() else '(not produced)'
          body = "\n".join([
              "F6E configurable Inventory View read-only runtime evidence.",
              "",
              f"status={os.environ['VERIFY_OUTCOME']}",
              f"source_sha={os.environ['GITHUB_SHA']}",
              f"workflow_run_id={os.environ['GITHUB_RUN_ID']}",
              "mutation=false",
              "database_canonical=false",
              "migration_baseline_accepted=false",
              "",
              "```text",
              evidence,
              "```",
          ])
          print(json.dumps({'body': body}))
          PY
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${EVIDENCE_ISSUE}" \
            --data-binary "@${BODY_FILE}" >/dev/null
          test "$VERIFY_OUTCOME" = success
