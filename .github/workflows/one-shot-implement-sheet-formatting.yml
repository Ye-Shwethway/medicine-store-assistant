name: One-shot Implement Sheet Formatting
on:
  push:
    branches: [feat/inventory-sheet-formatting-v1]
    paths: ['.github/workflows/one-shot-implement-sheet-formatting.yml']
permissions:
  contents: write
jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/inventory-sheet-formatting-v1
      - name: Patch authoritative Inventory renderer
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('backend/app/dashboard_assets/dashboard_inventory_views.js')
          s=p.read_text()

          replacements=[]
          replacements.append((
            "dateFormat:storedDateFormat};",
            "dateFormat:storedDateFormat,formatFills:new Map()};"
          ))

          replacements.append((
            ".inventory-selection-copy span{max-width:680px}.inventory-selection-actions #inventoryDetails{min-width:88px}\n    @media(max-width:760px)",
            ".inventory-selection-copy span{max-width:680px}.inventory-selection-actions{position:relative}.inventory-selection-actions #inventoryDetails{min-width:88px}.inventory-fill-menu[hidden]{display:none!important}.inventory-fill-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:24;display:grid;grid-template-columns:repeat(2,minmax(118px,1fr));gap:6px;width:min(320px,82vw);padding:8px;border:1px solid var(--border,#d9dde7);border-radius:11px;background:var(--card,#fff);box-shadow:0 14px 32px rgba(0,0,0,.16)}.inventory-fill-menu button{display:flex;align-items:center;gap:8px;justify-content:flex-start;min-height:40px;padding:7px 9px}.inventory-fill-swatch{width:18px;height:18px;flex:0 0 auto;border:1px solid color-mix(in srgb,#000 14%,transparent);border-radius:4px}.inventory-fill-swatch[data-fill-swatch=yellow]{background:#f4c542}.inventory-fill-swatch[data-fill-swatch=green]{background:#63b77d}.inventory-fill-swatch[data-fill-swatch=red]{background:#e47b7b}.inventory-fill-swatch[data-fill-swatch=blue]{background:#79aef2}.inventory-fill-swatch[data-fill-swatch=orange]{background:#e9a64f}.inventory-fill-swatch[data-fill-swatch=gray]{background:#9aa0aa}.inventory-view-table td[data-user-fill=yellow]{background:color-mix(in srgb,#f4c542 28%,var(--card,#fff))!important}.inventory-view-table td[data-user-fill=green]{background:color-mix(in srgb,#63b77d 27%,var(--card,#fff))!important}.inventory-view-table td[data-user-fill=red]{background:color-mix(in srgb,#e47b7b 25%,var(--card,#fff))!important}.inventory-view-table td[data-user-fill=blue]{background:color-mix(in srgb,#79aef2 27%,var(--card,#fff))!important}.inventory-view-table td[data-user-fill=orange]{background:color-mix(in srgb,#e9a64f 28%,var(--card,#fff))!important}.inventory-view-table td[data-user-fill=gray]{background:color-mix(in srgb,#9aa0aa 24%,var(--card,#fff))!important}.inventory-row-review td[data-col-index]::before,.inventory-row-critical td[data-col-index]::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;pointer-events:none;z-index:2}.inventory-row-review td[data-col-index]::before{background:#d49a24}.inventory-row-critical td[data-col-index]::before{background:#b43b55}\n    @media(max-width:760px)"
          ))

          old_actions='<div class="inventory-selection-actions"><button class="secondary" id="inventoryDetails" type="button">Details</button><button class="secondary" id="inventoryAskAI" type="button">Ask AI</button><button class="secondary" id="inventoryDeepReview" type="button">Deep Review</button><button class="secondary" id="inventoryCopySelected" type="button">Copy TSV</button><button class="secondary" id="inventoryClearSelection" type="button">Clear selection</button></div>'
          new_actions='<div class="inventory-selection-actions"><button class="secondary" id="inventoryDetails" type="button">Details</button><button class="secondary" id="inventoryAskAI" type="button">Ask AI</button><button class="secondary" id="inventoryDeepReview" type="button">Deep Review</button><button class="secondary" id="inventoryFillToggle" type="button" aria-expanded="false">Fill</button><div class="inventory-fill-menu" id="inventoryFillMenu" aria-label="Fill colors" hidden><button class="secondary" type="button" data-fill-token="yellow"><span class="inventory-fill-swatch" data-fill-swatch="yellow" aria-hidden="true"></span>Yellow</button><button class="secondary" type="button" data-fill-token="green"><span class="inventory-fill-swatch" data-fill-swatch="green" aria-hidden="true"></span>Light green</button><button class="secondary" type="button" data-fill-token="red"><span class="inventory-fill-swatch" data-fill-swatch="red" aria-hidden="true"></span>Light red</button><button class="secondary" type="button" data-fill-token="blue"><span class="inventory-fill-swatch" data-fill-swatch="blue" aria-hidden="true"></span>Light blue</button><button class="secondary" type="button" data-fill-token="orange"><span class="inventory-fill-swatch" data-fill-swatch="orange" aria-hidden="true"></span>Orange</button><button class="secondary" type="button" data-fill-token="gray"><span class="inventory-fill-swatch" data-fill-swatch="gray" aria-hidden="true"></span>Gray</button></div><button class="secondary" id="inventoryClearFill" type="button">Clear fill</button><button class="secondary" id="inventoryCopySelected" type="button">Copy TSV</button><button class="secondary" id="inventoryClearSelection" type="button">Clear selection</button></div>'
          replacements.append((old_actions,new_actions))

          replacements.append((
            "copySelected=$('#inventoryCopySelected'),focusToggle=$('#inventoryFocusToggle')",
            "copySelected=$('#inventoryCopySelected'),fillToggle=$('#inventoryFillToggle'),fillMenu=$('#inventoryFillMenu'),clearFill=$('#inventoryClearFill'),focusToggle=$('#inventoryFocusToggle')"
          ))

          anchor="function isCellSelected(row,col){const r=state.cellRange;return Boolean(r&&row>=r.r1&&row<=r.r2&&col>=r.c1&&col<=r.c2)}"
          insert=anchor+"\n  const FILL_TOKENS=new Set(['yellow','green','red','blue','orange','gray']);\n  function cellFormatKey(row,col){const item=state.items[row],column=state.columnsRendered[col];if(!item||!column)return null;return `${rowKey(item,row)}\\u0000${column.field}`}\n  function fillTokenFor(row,col){const key=cellFormatKey(row,col);return key?state.formatFills.get(key)||'':''}\n  function applyVisibleFormatting(){tbody.querySelectorAll('td[data-row-index][data-col-index]').forEach(cell=>{const token=fillTokenFor(Number(cell.dataset.rowIndex),Number(cell.dataset.colIndex));if(token)cell.dataset.userFill=token;else cell.removeAttribute('data-user-fill')})}\n  function applyFillToSelection(token=''){if(token&&!FILL_TOKENS.has(token))return;const targets=[];if(state.cellRange){for(let row=state.cellRange.r1;row<=state.cellRange.r2;row++)for(let col=state.cellRange.c1;col<=state.cellRange.c2;col++)targets.push([row,col])}else{for(const row of selectedIndices())for(let col=0;col<state.columnsRendered.length;col++)targets.push([row,col])}if(!targets.length)return;for(const [row,col] of targets){const key=cellFormatKey(row,col);if(!key)continue;if(token)state.formatFills.set(key,token);else state.formatFills.delete(key)}applyVisibleFormatting();fillMenu.hidden=true;fillToggle.setAttribute('aria-expanded','false')}"
          replacements.append((anchor,insert))

          replacements.append((
            "function clearSheetSelection(){state.selected.clear();state.rowAnchor=null;clearCellSelection();updateSelection()}",
            "function clearSheetSelection(){state.selected.clear();state.rowAnchor=null;clearCellSelection();if(fillMenu){fillMenu.hidden=true;fillToggle.setAttribute('aria-expanded','false')}updateSelection()}"
          ))

          old_render="active=Boolean(state.activeCell&&state.activeCell.row===index&&state.activeCell.col===colIndex);return `<td data-row-index=\"${index}\" data-col-index=\"${colIndex}\" data-field=\"${esc(col.field)}\" tabindex=\"${active?'0':'-1'}\" aria-selected=\"${selected?'true':'false'}\" class=\"${colIndex===0?'inventory-frozen-first ':''}${cellClass(col.field,value)}${selected?' inventory-cell-selected':''}${active?' inventory-cell-active':''}\" style=\"${width?`width:${width}px;min-width:${width}px;max-width:${width}px`:''}\" title=\"${esc(text)}\">${esc(text)}</td>`"
          new_render="active=Boolean(state.activeCell&&state.activeCell.row===index&&state.activeCell.col===colIndex),fill=fillTokenFor(index,colIndex);return `<td data-row-index=\"${index}\" data-col-index=\"${colIndex}\" data-field=\"${esc(col.field)}\"${fill?` data-user-fill=\"${esc(fill)}\"`:''} tabindex=\"${active?'0':'-1'}\" aria-selected=\"${selected?'true':'false'}\" class=\"${colIndex===0?'inventory-frozen-first ':''}${cellClass(col.field,value)}${selected?' inventory-cell-selected':''}${active?' inventory-cell-active':''}\" style=\"${width?`width:${width}px;min-width:${width}px;max-width:${width}px`:''}\" title=\"${esc(text)}\">${esc(text)}</td>`"
          replacements.append((old_render,new_render))

          replacements.append((
            "cell.tabIndex=active?0:-1});const header=thead.querySelector('#inventorySelectVisible');",
            "cell.tabIndex=active?0:-1});applyVisibleFormatting();const header=thead.querySelector('#inventorySelectVisible');"
          ))

          replacements.append((
            "copySelected.addEventListener('click',copySelection);",
            "copySelected.addEventListener('click',copySelection);\n  fillToggle.addEventListener('click',()=>{const open=fillMenu.hidden;fillMenu.hidden=!open;fillToggle.setAttribute('aria-expanded',String(open))});\n  fillMenu.addEventListener('click',event=>{const button=event.target.closest('[data-fill-token]');if(button)applyFillToSelection(button.dataset.fillToken)});\n  clearFill.addEventListener('click',()=>applyFillToSelection(''));"
          ))

          for old,new in replacements:
              count=s.count(old)
              if count!=1:
                  raise SystemExit(f'expected one match, got {count}: {old[:120]!r}')
              s=s.replace(old,new,1)
          p.write_text(s)
          PY
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add backend/app/dashboard_assets/dashboard_inventory_views.js
          git commit -m 'Implement session-only Inventory sheet fill formatting'
          git push origin HEAD:feat/inventory-sheet-formatting-v1
