name: Validate Inventory View Engine

on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/requirements.txt'
      - 'backend/app/inventory_view_engine.py'
      - 'backend/app/inventory_view_engine_verify.py'
      - 'backend/app/inventory_view_export.py'
      - 'backend/app/inventory_view_export_verify.py'
      - 'backend/app/tabular_excel_export.py'
      - 'backend/app/tabular_excel_export_verify.py'
      - 'backend/app/main.py'
      - 'backend/app/dashboard_assets/dashboard_inventory_views.js'
      - 'backend/app/dashboard_assets/dashboard_inventory_views.css'
      - 'backend/app/dashboard_assets/dashboard_inventory_export.js'
      - 'tests/web/inventory_view_engine_smoke.mjs'
      - 'tests/web/inventory_sorting_smoke.mjs'
      - 'tests/web/inventory_csv_export_smoke.mjs'
      - 'tests/web/inventory_excel_export_smoke.mjs'
      - 'tests/web/inventory_date_format_smoke.mjs'
      - 'tests/web/inventory_sheet_selection_smoke.mjs'
      - 'tests/web/inventory_sheet_formatting_smoke.mjs'
      - '.github/workflows/validate-inventory-view-engine.yml'

permissions:
  contents: read

jobs:
  view-engine-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -q -r backend/requirements.txt
      - name: Verify registry and presets
        run: PYTHONPATH=backend python -m app.inventory_view_engine_verify
      - name: Verify reusable Excel renderer
        run: PYTHONPATH=backend python -m app.tabular_excel_export_verify
      - name: Verify Inventory export contract
        run: PYTHONPATH=backend python -m app.inventory_view_export_verify
      - name: Verify router contract and main binding
        run: |
          PYTHONPATH=backend python - <<'PY'
          from pathlib import Path
          from app.inventory_view_engine import router
          from app.inventory_view_export import router as export_router
          paths = {getattr(route, 'path', None) for route in router.routes}
          required = {
              '/dashboard/api/inventory-view/registry',
              '/dashboard/api/inventory-view/presets',
              '/dashboard/api/inventory-view/rows',
              '/dashboard/api/inventory-view/review-context',
          }
          missing = required - paths
          assert not missing, sorted(missing)
          export_paths = {getattr(route, 'path', None) for route in export_router.routes}
          assert '/dashboard/api/inventory-view/export.xlsx' in export_paths
          assert '/dashboard/api/inventory-view/export.csv' in export_paths
          main_source = Path('backend/app/main.py').read_text(encoding='utf-8')
          assert 'from app.inventory_view_engine import router as inventory_view_router' in main_source
          assert 'from app.inventory_view_export import router as inventory_view_export_router' in main_source
          assert 'app.include_router(inventory_view_router)' in main_source
          assert 'app.include_router(inventory_view_export_router)' in main_source
          assert 'dashboard_inventory_export.js' in main_source
          print('inventory_view_routes=pass review_context_route=pass excel_export_route=pass csv_compat_route=pass main_binding=pass')
          PY
      - name: Verify Inventory JavaScript syntax
        run: |
          node --check backend/app/dashboard_assets/dashboard_inventory_views.js
          node --check backend/app/dashboard_assets/dashboard_inventory_export.js
      - name: Verify Ask AI waits for loaded agents
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('backend/app/dashboard_assets/dashboard_inventory_views.js').read_text(encoding='utf-8')
          assert 'async function waitForChatAgents' in source
          assert "const loading=options.length===1&&/Loading/i.test" in source
          assert 'async function addChatStarter' in source
          assert 'const canonicalAgent=await waitForChatAgents()' in source
          assert 'await addChatStarter(context,card)' in source
          print('inventory_agent_loader_race_guard=pass')
          PY

  inventory-browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Playwright for CI only
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run configurable Inventory browser interaction smoke
        run: node tests/web/inventory_view_engine_smoke.mjs
      - name: Run Inventory server sorting smoke
        run: node tests/web/inventory_sorting_smoke.mjs
      - name: Run Inventory Excel export smoke
        run: node tests/web/inventory_excel_export_smoke.mjs
      - name: Run Inventory date format preference smoke
        run: node tests/web/inventory_date_format_smoke.mjs
      - name: Run Inventory Sheet Interaction smoke
        run: node tests/web/inventory_sheet_selection_smoke.mjs
      - name: Run Inventory Sheet Formatting smoke
        run: node tests/web/inventory_sheet_formatting_smoke.mjs
