name: One-shot Fix Formatting Menuitem Smoke
on:
  push:
    branches: [fix/inventory-fill-runtime-ux]
    paths: ['.github/workflows/one-shot-fix-formatting-menuitem-smoke.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/inventory-fill-runtime-ux
      - name: Align palette smoke with menu semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('tests/web/inventory_sheet_formatting_smoke.mjs')
          s=p.read_text()
          s=s.replace("page.getByRole('button',{name,exact:true})","page.getByRole('menuitem',{name,exact:true})")
          s=s.replace("page.getByRole('button',{name:'Yellow',exact:true})","page.getByRole('menuitem',{name:'Yellow',exact:true})")
          s=s.replace("page.getByRole('button',{name:'Orange',exact:true})","page.getByRole('menuitem',{name:'Orange',exact:true})")
          p.write_text(s)
          PY
          node --check tests/web/inventory_sheet_formatting_smoke.mjs
          git diff --check
          git config user.name 'Mr. Thorne'
          git config user.email '85703541+Ye-Shwethway@users.noreply.github.com'
          git add tests/web/inventory_sheet_formatting_smoke.mjs
          git commit -m 'Align Inventory fill smoke with menu semantics'
          git push origin HEAD:fix/inventory-fill-runtime-ux
