name: One-shot Multi-Agent single-surface patcher

on:
  pull_request_target:
    branches: [main]
    paths:
      - 'docs/checkpoints/multi-agent-single-surface-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/multi-agent-single-chatbox-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/multi-agent-single-chatbox-ui
          fetch-depth: 0
          persist-credentials: true
      - name: Apply single-surface UI patch
        run: |
          set -euo pipefail
          python scripts/patch_multi_agent_single_surface.py
          node --check backend/app/dashboard_assets/dashboard_multi_agent_live_export.js
          git diff --check
          git config user.name 'MSA Multi-Agent UI Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add backend/app/dashboard_assets/dashboard_multi_agent_live_export.js backend/app/dashboard_assets/dashboard_multi_agent_review.css
          git commit -m 'Use one chat surface for Multi-Agent Review'
          git push origin HEAD:fix/multi-agent-single-chatbox-ui
