name: Deploy MSA backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-f5.yml'

permissions:
  contents: write

concurrency:
  group: msa-vps-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Preflight runner access
        shell: bash
        run: |
          set -euo pipefail
          id
          docker version
          docker compose version
          test -r /opt/medicine-store-assistant/secrets/runtime.env
          echo "runner_preflight=pass"

      - name: Deploy and verify backend
        shell: bash
        run: bash deploy/apply_backend.sh

      - name: Record deployment evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B deployment-evidence origin/main
            printf 'status=%s\nsource_sha=%s\nworkflow_run_id=%s\n' "$DEPLOY_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/backend-deploy-result
            git add .github/backend-deploy-result

            if git diff --cached --quiet; then
              exit 0
            fi

            git commit -m "Record MSA backend deployment result"
            if git push origin HEAD:main; then
              exit 0
            fi

            sleep $((attempt * 2))
          done

          echo "warning: deployment evidence marker could not be pushed after retries" >&2
          exit 1
