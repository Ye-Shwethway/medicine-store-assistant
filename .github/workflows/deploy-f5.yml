name: Deploy F5 to VPS

on:
  workflow_dispatch:
  push:
    paths:
      - .github/f5-deploy-trigger

permissions:
  contents: write

concurrency:
  group: msa-vps-deploy
  cancel-in-progress: false

jobs:
  deploy-f5:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preflight runner access
        shell: bash
        run: |
          set -euo pipefail
          id
          docker version
          docker compose version
          test -r /opt/medicine-store-assistant/secrets/runtime.env
          echo "runner_preflight=pass"

      - name: Deploy and verify F5
        shell: bash
        run: bash deploy/apply_f5_catalogue_versioning.sh

      - name: Record successful deployment
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=pass\nsource_sha=%s\nworkflow_run_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/f5-deploy-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/f5-deploy-result
          git commit -m "Record successful F5 VPS deployment"
          git push
