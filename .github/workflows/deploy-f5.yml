name: Deploy MSA backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-f5.yml'

permissions:
  contents: write

concurrency:
  group: msa-vps-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preflight runner access
        shell: bash
        run: |
          set -euo pipefail
          id
          docker version
          docker compose version
          test -r /opt/medicine-store-assistant/secrets/runtime.env
          set -a
          source /opt/medicine-store-assistant/secrets/runtime.env
          set +a
          test -n "${MSA_GOOGLE_SPREADSHEET_ID:-}"
          test -n "${MSA_GOOGLE_SERVICE_ACCOUNT_FILE:-}"
          test -r "$MSA_GOOGLE_SERVICE_ACCOUNT_FILE"
          echo "runner_preflight=pass google_readonly_credentials=pass"

      - name: Deploy and verify backend
        shell: bash
        run: bash deploy/apply_f6b_live_shadow_snapshot.sh

      - name: Record deployment evidence
        if: always()
        shell: bash
        env:
          DEPLOY_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          printf 'status=%s\nsource_sha=%s\nworkflow_run_id=%s\n' "$DEPLOY_STATUS" "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/backend-deploy-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/backend-deploy-result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record MSA backend deployment result"
          git push origin HEAD:main
