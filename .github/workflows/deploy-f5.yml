name: Deploy MSA backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-f5.yml'

permissions:
  contents: write

concurrency:
  group: msa-vps-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Preflight runner access
        shell: bash
        run: |
          set -euo pipefail
          id
          docker version
          docker compose version
          test -r /opt/medicine-store-assistant/secrets/runtime.env
          echo "runner_preflight=pass"

      - name: Deploy and verify backend
        shell: bash
        run: bash deploy/apply_f5_catalogue_versioning.sh

      - name: Record verified deployment evidence
        shell: bash
        run: |
          set -euo pipefail
          printf 'status=pass\nsource_sha=%s\nworkflow_run_id=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" > .github/backend-deploy-result
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/backend-deploy-result
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Record verified MSA backend deployment"
          git push origin HEAD:main
