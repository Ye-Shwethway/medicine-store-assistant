name: Deploy MSA backend to VPS

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'deploy/**'
      - '.github/workflows/deploy-f5.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: msa-vps-deploy
  cancel-in-progress: false

jobs:
  deploy-backend:
    runs-on: [self-hosted, linux, msa-vps]
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          path: source
          persist-credentials: false

      - name: Preflight runner access
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          id
          docker version
          docker compose version
          test -r /opt/medicine-store-assistant/secrets/runtime.env
          echo "runner_preflight=pass"

      - name: Deploy and verify backend
        shell: bash
        working-directory: source
        run: bash deploy/apply_backend.sh

      - name: Verify public MCP OAuth boundary
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://inventory.drthorne.uk"
          AUTH_META="$(curl --fail --silent --show-error "${BASE}/.well-known/oauth-authorization-server/oauth")"
          RESOURCE_META="$(curl --fail --silent --show-error "${BASE}/.well-known/oauth-protected-resource/mcp")"
          python3 - "$AUTH_META" "$RESOURCE_META" <<'PY'
          import json, sys
          auth = json.loads(sys.argv[1])
          resource = json.loads(sys.argv[2])
          assert auth["issuer"] == "https://inventory.drthorne.uk/oauth"
          assert auth["authorization_endpoint"].endswith("/oauth/authorize")
          assert auth["token_endpoint"].endswith("/oauth/token")
          assert auth["registration_endpoint"].endswith("/oauth/register")
          assert "offline_access" in auth["scopes_supported"]
          assert "S256" in auth["code_challenge_methods_supported"]
          assert resource["resource"] == "https://inventory.drthorne.uk/mcp"
          assert "https://inventory.drthorne.uk/oauth" in resource["authorization_servers"]
          print("mcp_oauth_public_metadata=pass")
          PY
          MCP_STATUS="$(curl --silent --output /dev/null --write-out '%{http_code}' "${BASE}/mcp")"
          if [[ "$MCP_STATUS" != "401" ]]; then
            echo "error: unauthenticated MCP endpoint returned HTTP ${MCP_STATUS}, expected 401" >&2
            exit 1
          fi
          echo "mcp_unauthenticated_guard=pass:401"

      - name: Publish deployment status
        if: always()
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          STATUS_ISSUE: '26'
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          BODY_FILE="${RUNNER_TEMP}/msa-deploy-status.json"
          export RUN_URL
          python3 - <<'PY' > "$BODY_FILE"
          import json, os
          from datetime import datetime, timezone
          status = os.environ['JOB_STATUS']
          body = "\n".join([
              "Machine-readable deployment status for Medicine Store Assistant.",
              "",
              f"status={status}",
              f"source_sha={os.environ['GITHUB_SHA']}",
              f"workflow_run_id={os.environ['GITHUB_RUN_ID']}",
              f"workflow_run_url={os.environ['RUN_URL']}",
              f"workflow_attempt={os.environ.get('GITHUB_RUN_ATTEMPT', '1')}",
              f"updated_at={datetime.now(timezone.utc).isoformat()}",
              "publisher=deploy-f5.yml",
          ])
          print(json.dumps({"body": body}))
          PY
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${STATUS_ISSUE}" \
            --data-binary "@${BODY_FILE}" >/dev/null
          echo "deployment_status_issue=${STATUS_ISSUE} status=${JOB_STATUS} run=${GITHUB_RUN_ID}"

      - name: Report deployment result
        if: always()
        shell: bash
        run: |
          echo "source_sha=${GITHUB_SHA}"
          echo "workflow_run_id=${GITHUB_RUN_ID}"
          echo "workflow_job_status=${{ job.status }}"
          echo "deployment_status_issue=26"
