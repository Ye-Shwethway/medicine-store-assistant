name: One-shot D4.8 root fix patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/one-shot-d4-8-root-fix.yml'

permissions:
  contents: write

jobs:
  patch-fix-branch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out fix branch
        uses: actions/checkout@v5
        with:
          ref: fix/d4-8-review-root-cause
          fetch-depth: 0
          persist-credentials: true
      - name: Apply exact root-cause and UI state fixes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              found = text.count(old)
              if found != count:
                  raise SystemExit(f"{path}: expected {count} exact match(es), found {found}")
              p.write_text(text.replace(old, new, count))

          # Confirmed production root cause: psycopg inferred :target as both text and varchar.
          replace_exact(
              'backend/app/multi_agent_review.py',
              '''def _set_status(connection: Any, work_item_id: str, target: str) -> None:\n    connection.execute(\n        text(\n            """\n            UPDATE workflow_work_items\n            SET status=:target, updated_at=now(),\n                completed_at=CASE WHEN :target IN ('COMMITTED','CANCELLED') THEN now() ELSE completed_at END\n            WHERE work_item_id=CAST(:work_item_id AS uuid)\n            """\n        ),\n        {"work_item_id": work_item_id, "target": target},\n    )\n''',
              '''def _set_status(connection: Any, work_item_id: str, target: str) -> None:\n    terminal = target in {"COMMITTED", "CANCELLED"}\n    statement = (\n        """\n        UPDATE workflow_work_items\n        SET status=CAST(:target AS varchar), updated_at=now(), completed_at=now()\n        WHERE work_item_id=CAST(:work_item_id AS uuid)\n        """\n        if terminal\n        else """\n        UPDATE workflow_work_items\n        SET status=CAST(:target AS varchar), updated_at=now()\n        WHERE work_item_id=CAST(:work_item_id AS uuid)\n        """\n    )\n    connection.execute(\n        text(statement),\n        {"work_item_id": work_item_id, "target": target},\n    )\n'''
          )

          js = Path('backend/app/dashboard_assets/dashboard_multi_agent_review.js')
          text = js.read_text()
          old = '  let busy=false;\n'
          new = '  let busy=false;\n  let rolesSaved=false;\n'
          if text.count(old) != 1:
              raise SystemExit('review JS: busy state anchor drifted')
          text = text.replace(old, new, 1)

          old = '''  function setBusy(value){\n    busy=value;\n    host.querySelectorAll('button,input,select,textarea').forEach(el=>{if(!el.dataset.alwaysEnabled)el.disabled=value});\n    const run=host.querySelector('#reviewRun');if(run)run.textContent=value?'Review running…':'Run native review';\n  }\n'''
          new = '''  function syncRoleSaveState(){\n    const save=host.querySelector('#reviewSaveRoles');if(!save)return;\n    const hasRows=host.querySelectorAll('[data-role-agent]').length>0;\n    save.textContent=rolesSaved?'Saved':'Save roles';\n    save.disabled=busy||!hasRows||rolesSaved;\n  }\n  function setBusy(value){\n    busy=value;\n    host.querySelectorAll('button,input,select,textarea').forEach(el=>{if(!el.dataset.alwaysEnabled)el.disabled=value});\n    const run=host.querySelector('#reviewRun');if(run)run.textContent=value?'Review running…':'Run native review';\n    syncRoleSaveState();\n  }\n'''
          if text.count(old) != 1:
              raise SystemExit('review JS: setBusy anchor drifted')
          text = text.replace(old, new, 1)

          old = "    if(!selectedSession){meta.innerHTML='';rows.innerHTML='<div class=\"empty-copy\">Choose a REVIEW preset.</div>';save.disabled=true;return}\n"
          new = "    if(!selectedSession){rolesSaved=false;meta.innerHTML='';rows.innerHTML='<div class=\"empty-copy\">Choose a REVIEW preset.</div>';syncRoleSaveState();return}\n"
          if text.count(old) != 1:
              raise SystemExit('review JS: no-session render anchor drifted')
          text = text.replace(old, new, 1)

          old = '    save.disabled=!participants.length;\n'
          new = '    syncRoleSaveState();\n'
          if text.count(old) != 1:
              raise SystemExit('review JS: render save anchor drifted')
          text = text.replace(old, new, 1)

          old = '''  async function selectSession(id){\n    selectedSession=sessions.find(s=>s.session_id===id)||null;roleState=[];renderRoles();if(!selectedSession)return;\n    try{const data=await api('/dashboard/api/ai-workspace/multi-agent/sessions/'+encodeURIComponent(id)+'/roles');roleState=data.roles||[];renderRoles()}catch(err){if(err.status!==404)setStatus(err.message,'error')}\n  }\n'''
          new = '''  async function selectSession(id){\n    selectedSession=sessions.find(s=>s.session_id===id)||null;roleState=[];rolesSaved=false;renderRoles();if(!selectedSession)return;\n    try{\n      const data=await api('/dashboard/api/ai-workspace/multi-agent/sessions/'+encodeURIComponent(id)+'/roles');\n      roleState=data.roles||[];\n      const participantCount=(selectedSession.participants||[]).filter(p=>p.is_active!==false).length;\n      rolesSaved=participantCount>0&&roleState.length===participantCount;\n      renderRoles();\n    }catch(err){if(err.status!==404)setStatus(err.message,'error')}\n  }\n'''
          if text.count(old) != 1:
              raise SystemExit('review JS: selectSession anchor drifted')
          text = text.replace(old, new, 1)

          old = "    try{await api('/dashboard/api/ai-workspace/multi-agent/sessions/'+encodeURIComponent(selectedSession.session_id)+'/roles',{method:'PUT',body:JSON.stringify({assignments})});const data=await api('/dashboard/api/ai-workspace/multi-agent/sessions/'+encodeURIComponent(selectedSession.session_id)+'/roles');roleState=data.roles||[];renderRoles();setStatus('Roles saved. These labels do not grant authority.','success')}catch(err){setStatus(err.message,'error')}finally{setBusy(false)}\n"
          new = "    try{await api('/dashboard/api/ai-workspace/multi-agent/sessions/'+encodeURIComponent(selectedSession.session_id)+'/roles',{method:'PUT',body:JSON.stringify({assignments})});const data=await api('/dashboard/api/ai-workspace/multi-agent/sessions/'+encodeURIComponent(selectedSession.session_id)+'/roles');roleState=data.roles||[];rolesSaved=true;renderRoles();setStatus('Roles saved. These labels do not grant authority.','success')}catch(err){setStatus(err.message,'error')}finally{setBusy(false)}\n"
          if text.count(old) != 1:
              raise SystemExit('review JS: save success anchor drifted')
          text = text.replace(old, new, 1)

          old = "  host.addEventListener('change',event=>{if(event.target.id==='reviewSessionSelect')selectSession(event.target.value);if(event.target.id==='reviewEvidenceConversation')loadEvidenceFiles(event.target.value)});\n"
          new = "  host.addEventListener('change',event=>{if(event.target.id==='reviewSessionSelect')selectSession(event.target.value);if(event.target.id==='reviewEvidenceConversation')loadEvidenceFiles(event.target.value);if(event.target.matches('[data-role-select],[data-role-label]')){rolesSaved=false;syncRoleSaveState()}});\n  host.addEventListener('input',event=>{if(event.target.matches('[data-role-label]')){rolesSaved=false;syncRoleSaveState()}});\n"
          if text.count(old) != 1:
              raise SystemExit('review JS: change listener anchor drifted')
          text = text.replace(old, new, 1)
          js.write_text(text)

          # Force browsers to fetch the new Review JS/CSS URL after the chatbox/UI change.
          replace_exact('backend/app/main.py', 'MULTI_AGENT_REVIEW_ASSET_VERSION = "f72d48-review-ui-1"', 'MULTI_AGENT_REVIEW_ASSET_VERSION = "f72d48-review-ui-2"')

          workflow = Path('.github/workflows/validate-ai-workspace-chat.yml')
          wt = workflow.read_text()
          if wt.count('f72d48-review-ui-1') < 2:
              raise SystemExit('AI Workspace workflow: expected old asset version assertions')
          wt = wt.replace('f72d48-review-ui-1', 'f72d48-review-ui-2')
          marker = "          ! grep -Fq 'f72d48-review-ui-0' backend/app/main.py\n"
          if marker not in wt:
              raise SystemExit('AI Workspace workflow: stale marker guard anchor drifted')
          wt = wt.replace(marker, marker + "          ! grep -Fq 'f72d48-review-ui-1' backend/app/main.py\n", 1)
          workflow.write_text(wt)

          # Temporary diagnostic workflow/trigger are no longer needed; keep the high-value runtime verifier.
          for path in ['.github/workflows/diagnose-d4-8-review.yml', 'docs/checkpoints/.diag-trigger']:
              p=Path(path)
              if p.exists():
                  p.unlink()
          PY

          python -m compileall -q backend/app
          node --check backend/app/dashboard_assets/dashboard_multi_agent_review.js
          git diff --check
          git config user.name 'MSA D4.8 Root Fix'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Fix D4.8 Review root cause and saved role state'
          git push origin HEAD:fix/d4-8-review-root-cause
