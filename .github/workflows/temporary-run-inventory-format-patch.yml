name: Temporary Inventory format branch patch

on:
  push:
    branches: [main]
    paths: ['.github/workflows/temporary-run-inventory-format-patch.yml']

permissions:
  contents: write

jobs:
  patch-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/inventory-format-polish
          fetch-depth: 0
      - name: Patch branch files
        run: python scripts/patch_inventory_format.py
      - name: Commit branch patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/inventory_view_export.py backend/app/dashboard_assets/dashboard_inventory_views.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Polish Inventory quantity and date formats"
          git push origin HEAD:feat/inventory-format-polish
